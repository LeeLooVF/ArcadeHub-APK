name: Build Arcade Hub APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Préparer le favicon dans www/icon.png
        run: |
          if [ -f "Portail d'arcade quiz néon.png" ]; then
            cp "Portail d'arcade quiz néon.png" www/icon.png
          fi

      - name: Install dependencies & Capacitor Android
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Générer les icônes Android depuis le favicon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          SRC="Portail d'arcade quiz néon.png"
          if [ -f "$SRC" ]; then
            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              DIR="${pair%%:*}"
              SIZE="${pair##*:}"
              mkdir -p "android/app/src/main/res/mipmap-$DIR"
              convert "$SRC" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "android/app/src/main/res/mipmap-$DIR/ic_launcher.png"
              convert "$SRC" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "android/app/src/main/res/mipmap-$DIR/ic_launcher_round.png"
              convert "$SRC" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "android/app/src/main/res/mipmap-$DIR/ic_launcher_foreground.png"
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Ajouter les permissions Android (Réseau + Installation MAJ)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' "$MANIFEST"
          grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST" || sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application/' "$MANIFEST"
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$MANIFEST" || sed -i 's/<application/<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" \/>\n    <application/' "$MANIFEST"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ArcadeHub.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Choisis-ton-Defi-APK
          path: ArcadeHub.apk

      - name: Publier la dernière version sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ArcadeHub - Dernière mise à jour
          files: ArcadeHub.apk
          overwrite_files: true
